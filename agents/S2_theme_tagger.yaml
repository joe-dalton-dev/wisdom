# Agent card: S2 theme and topic tagger. Change anything -> bump `version`.
id: S2_theme_tagger
version: 0.4.0
level: 1
base: _base.md@0.2.0
unit: sentence
windows: windows_sentence.jsonl      # 5 target sentences, 4 before and 2 after as context
output_schema: schemas/S2_output.schema.json
codebook_version: themes@0.1.1+topics@0.1.0
labels: [themes, topics]             # the full theme and topic lists, with definitions, go in the prompt

task: |
  For each TARGET sentence, choose up to 3 THEMES and up to 3 TOPICS that the sentence itself expresses.
  - A theme is what the sentence means (Compassion, Cosmic order). A topic is what it is literally about
    (Fasting, Animals at work). A sentence can have themes without topics and the reverse.
  - Follow each label's definition and its include and exclude rules. When an exclude rule names another
    label, use that one instead.
  - salience: 1 = present, 2 = central to the sentence, 3 = the point of the passage. Never use 0:
    if an idea is only touched in passing, leave it out.
  - span: the few words of the target that carry the label, copied exactly.
  - Tag the idea, not a word. A word that matches a label's name is not evidence: "know" is not
    Knowledge & ignorance, "order" is not Cosmic order, "work" is not Perseverance. Ask what the sentence
    teaches or claims, then find the label for that.
  - Tag a theme when the sentence rejects, questions or reverses it, not only when it affirms it.
    "Heaven and earth are not benevolent" carries Compassion & mercy. Whether the text affirms or
    rejects is recorded later, at book level.
  - Read who acts. When "the sage" or a ruler governs the people, the sentence is about rulership.
  - After the main idea, check for a second and a third distinct idea. Teaching sentences in wisdom texts
    often carry 2 or 3 themes; a clearly present secondary idea gets salience 1. Leave a slot empty only
    when nothing else is clearly there. Narrative connectives ("And the LORD spoke unto Moses, saying:")
    carry none.
  - Knowledge & ignorance is only for seeing through delusion to how things really are. Learning, love
    of virtue and correcting one's faults are Self-cultivation; sound judgement and the wise versus the
    fool are Wisdom.
  - Spells, charms, runes, witches and seeresses working magic are Magic & invocation.
  - A promise of life or death for keeping or breaking a law is Retribution & consequence, not
    Liberation & salvation.
  - The EXAMPLES below show the level of detail wanted. They are not a list to copy from.
  - proposal: only when the sentence clearly carries an idea that no listed theme covers. Give a short label,
    a one-line reason and the span. Otherwise all three proposal fields are empty strings.

model: claude-haiku-5-5
max_tokens: 2000
effort: low
examples:           # from the dev half of the gold set only (project/gold_split.json); never from test
  - |
    "He who (tries to) govern a state by his wisdom is a scourge to it; while he who does not (try to) do so is a blessing."
    themes: Good rulership (3) "govern a state by his wisdom is a scourge to it"; Simplicity & non-striving (2) "he who does not (try to) do so is a blessing"; Wisdom (1) "by his wisdom"
  - |
    "The thirty spokes unite in the one nave; but it is on the empty space (for the axle), that the use of the wheel depends."
    themes: Paradox & the ineffable (2) "it is on the empty space (for the axle), that the use of the wheel depends"
  - |
    "The Bhikshu whose body and tongue and mind are quieted, who is collected, and has rejected the baits of the world, he is called quiet."
    themes: Inner peace (3) "he is called quiet"; Self-discipline (2) "body and tongue and mind are quieted"; Renunciation (2) "has rejected the baits of the world"
  - |
    "He did not transfer his anger; he did not repeat a fault."
    themes: Mastery of emotion (2) "He did not transfer his anger"; Self-cultivation (2) "he did not repeat a fault"
  - |
    "The Master said, "I have not seen one who loves virtue as he loves beauty.""
    themes: Desire & attachment (2) "as he loves beauty"; Self-cultivation (1) "loves virtue"
  - |
    "Ye shall therefore keep My statutes, and Mine ordinances, which if a man do, he shall live by them: I am the LORD."
    themes: Divine command (3) "Ye shall therefore keep My statutes, and Mine ordinances"; Retribution & consequence (1) "he shall live by them"
  - |
    "Heith they named her | who sought their home, The wide-seeing witch, | in magic wise; ..."
    themes: Magic & invocation (2) "The wide-seeing witch, | in magic wise"

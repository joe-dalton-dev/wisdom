# Agent card: S2 theme and topic tagger (TEMPLATE - draft, not yet tested)
# Every field below is pinned. Change anything -> bump `version`, run the regression test,
# add a CHANGELOG entry, and release a new cards-vX.Y tag.

id: S2_theme_tagger
version: 0.1.0
level: 1
base: _base.md@0.1.0

task: >
  For each TARGET sentence, choose up to 3 themes and up to 3 topics from CANDIDATES
  that the sentence itself expresses, each with salience 0-3 and an evidence span.
  Use CONTEXT only to understand the targets. If no candidate fits a target that
  clearly carries a theme, use the proposal slot.

inputs:
  - targets           # list of {unit_id, text}, normally 5
  - context_before    # up to 4 sentences, read-only
  - context_after     # up to 2 sentences, read-only
  - candidates        # up to 8 themes + up to 8 topics from triage (T2), with definitions

output_schema: schemas/S2_output.schema.json
codebook: codebook/themes.yaml@0.1.0, codebook/topics.yaml@0.1.0   # only candidate entries are inserted
examples: examples/S2/v0/   # fixed set, fixed order (to be created from the gold set)

model: TBD                   # filled from agents/models.lock after the pilot bake-off
server: llama-server@TBD
params:
  temperature: 0
  top_p: 1
  seed: 7
  max_tokens: 600
retries: 2                   # schema failures only; then route to V2

gold_score:
  test_f1: null              # filled by the pilot
  measured: null

name: checks
on: [pull_request, push]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml
      - name: Codebook, cards and schemas parse
        run: python tools/validate_repo.py
      - name: CHECKLIST.md is up to date
        run: |
          python tools/csv_to_checklist.py project/checklist.csv /tmp/CHECKLIST.md
          diff -u CHECKLIST.md /tmp/CHECKLIST.md

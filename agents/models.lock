# Pinned models and their prices (USD per million tokens), read by the runner for cost estimates and
# spend tracking. API models are pinned by model ID; local models by file hash once the bake-off picks them.
# Prices checked 2026-11-22 against platform.claude.com/docs/en/about-claude/pricing. Re-check before big runs.
models:
  claude-haiku-5-5:
    provider: anthropic
    standard: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
    batch:    {input: 0.05, output: 0.25, cache_read: 0.005, cache_write: 0.0625}
    note: rates above are for prompts up to 100,000 tokens; every pilot prompt is far below that
  claude-sonnet-5-5:
    provider: anthropic
    standard: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
    batch:    {input: 1.00, output: 5.00, cache_read: 0.05, cache_write: 1.25}
